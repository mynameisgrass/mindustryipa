name: Build iOS IPA

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          repository: 'Anuken/Mindustry'
          path: 'Mindustry'
          fetch-depth: 0

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: 'Anuken/Arc'
          path: 'Arc'
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Arc Natives
        run: |
          cd Arc
          chmod +x gradlew
          ./gradlew extractMetalANGLEKit

      - name: Disable iOS Signing
        run: |
          cd Mindustry
          # Modify ios/build.gradle to skip signing and fix app build
          sed -i '' 's/iosSkipSigning = false/iosSkipSigning = true/g' ios/build.gradle
          sed -i '' "s/props\['app.build'\] = .*/props['app.build'] = '1'/g" ios/build.gradle || true
      
      - name: Build IPA
        run: |
          cd Mindustry
          chmod +x gradlew
          ./gradlew ios:createIPA

      - name: Get Commit Hash and Date
        id: get_meta
        run: |
          cd Mindustry
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.get_meta.outputs.date }}-${{ steps.get_meta.outputs.hash }}
          name: "Mindustry iOS Build ${{ steps.get_meta.outputs.hash }}"
          files: Mindustry/ios/build/robovm/IOSLauncher.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
